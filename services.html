<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=index.html#businesses" />
  <link rel="canonical" href="https://futurecountllc.com/#businesses" />
  <title>FutureCount Holdings LLC | Portfolio</title>
  <style>
    :root{--ink:#102033;--muted:#5f6d7d;--soft:#dfe7e5;--cream:#f3f6f3;--line:rgba(89,109,119,.24);--navy:#0b2742;--panel:rgba(250,252,250,.94);}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{min-height:100vh;display:grid;place-items:center;padding:28px;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(90deg,rgba(11,39,66,.045) 1px,transparent 1px),linear-gradient(180deg,#edf2ef 0%,var(--cream) 38%,var(--soft) 100%);background-size:92px 92px,auto;color:var(--ink);line-height:1.55;}
    .panel{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 24px 60px rgba(8,25,39,.12);}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
    .brand img{width:34px;height:34px;object-fit:contain;opacity:.78;}
    strong{color:var(--navy);}
    p{color:var(--muted);margin-top:8px;}
    a{color:var(--navy);font-weight:800;text-decoration:none;}
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand">
      <img src="assets/img/futurecount-logo-header-footer-animated.svg" alt="" />
      <strong>FutureCount Holdings LLC</strong>
    </div>
    <p>FutureCount services are now shown in the portfolio. Continue to <a href="index.html#businesses">the Portfolio section</a>.</p>
  </main>
</body>
</html>
