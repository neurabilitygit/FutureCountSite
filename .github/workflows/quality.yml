name: Website quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check pages, links, metadata, resources and release content
        run: python scripts/check_site.py
      - name: Check structured identity and search discovery configuration
        run: python scripts/check_discovery.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check navigation JavaScript syntax
        run: node --check assets/navigation.js
