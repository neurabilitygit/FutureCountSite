name: Notify search engines with IndexNow

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'assets/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'llms.txt'
      - 'indexnow-key.txt'
      - 'scripts/notify_indexnow.py'
      - 'scripts/check_discovery.py'
      - '.github/workflows/indexnow.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-publication
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the release before notification
        run: |
          python scripts/check_site.py
          python scripts/check_discovery.py
      - name: Notify participating search engines after verifying the live release
        run: python scripts/notify_indexnow.py --wait-for-live 180
